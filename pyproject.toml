[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "avero-devdeck"
version = "0.1.5"
description = "A browser-authenticated GitHub command center for developers"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Avero Labs" }]
keywords = ["github", "developer-tools", "cli", "releases", "repositories"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Environment :: Console",
  "Topic :: Software Development",
]
dependencies = ["requests>=2.31.0", "rich>=13.7.0", "platformdirs>=4.2.0"]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
devdeck = "avero_devdeck.cli:main"

[tool.hatch.build.targets.wheel]
only-include = ["src/avero_devdeck"]
sources = ["src"]
